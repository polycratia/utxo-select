[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utxo-select"
version = "0.1.0"
description = "Coin selection for UTXO chains: pick inputs, compute change, estimate fees, and explain why a selection failed."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["utxo", "coin-selection", "bitcoin", "fees", "change", "wallet"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/polycratia/utxo-select"
Source = "https://github.com/polycratia/utxo-select"
Issues = "https://github.com/polycratia/utxo-select/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/utxo_select"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
